[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-infra"
version = "0.3.0"
description = "Jarvis — Personal AI Agent Infrastructure"
requires-python = ">=3.11"
dependencies = [
    # LangGraph core
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # HTTP
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    # Config
    "tomli>=2.0.0; python_version < '3.11'",
    # Plugin system
    "pluggy>=1.4.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",
    # Async
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# 向量检索（语义记忆）
vector = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
# 持久化升级（PostgreSQL checkpoint）
persist = [
    "langgraph-checkpoint-postgres>=0.1.0",
    "psycopg[binary]>=3.1.0",
]
# 日报调度
scheduler = [
    "apscheduler>=3.10.0",
]
# 文件系统监听（低延迟）
filewatcher = [
    "watchdog>=4.0.0",
]
# 可观测性
observability = [
    "langsmith>=0.1.0",
]
# 完整安装（推荐）
full = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "apscheduler>=3.10.0",
    "watchdog>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipython>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
jarvis = "agent_infra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_infra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
